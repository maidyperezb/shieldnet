; ====================================================================
; Rango de puertos RTP. Debe coincidir con los puertos publicados en
; docker-compose.yml.
; ====================================================================

[general]
rtpstart=10000
rtpend=10100

; En un entorno con NAT/Docker, el aprendizaje estricto de RTP puede
; provocar audio en una sola dirección.
strictrtp=no
icesupport=no
rtcp_mux=no
