; ====================================================================
; Carga automática de módulos
; ====================================================================

[modules]
autoload=yes

; El proyecto usa chan_sip porque el backend consulta la acción AMI
; "SIPpeers". PJSIP queda cargado pero sin transporte configurado.
noload => chan_alsa.so
noload => chan_console.so

; Módulos que no se usan en esta instalación y que generan errores o
; advertencias innecesarias en los logs.
noload => app_voicemail.so
noload => app_voicemail_imap.so
noload => app_voicemail_odbc.so
noload => cdr_adaptive_odbc.so
