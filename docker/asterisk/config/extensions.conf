; ====================================================================
; Plan de marcado interno
; ====================================================================

[general]
static=yes
writeprotect=yes
clearglobalvars=no

[internal]
; Llamadas entre las extensiones configuradas.
exten => 1001,1,NoOp(Llamada entrante para Ventas)
 same => n,Dial(SIP/1001,30,tT)
 same => n,Hangup()

exten => 1002,1,NoOp(Llamada entrante para Almacén)
 same => n,Dial(SIP/1002,30,tT)
 same => n,Hangup()

; Cualquier otra extensión de 4 dígitos que empiece por 1.
exten => _1XXX,1,Dial(SIP/${EXTEN},30,tT)
 same => n,Hangup()

; Prueba de audio: marca 600 y escucha tu propia voz.
exten => 600,1,Answer()
 same => n,Wait(1)
 same => n,Echo()
 same => n,Hangup()
