<!-- Chat Widget Fragment (Thymeleaf) -->
<div id="chat-widget" class="chat-widget" th:fragment="chat-widget">
    <!-- Botón flotante (minimizado por defecto) -->
    <button id="chat-toggle-btn" class="chat-toggle" title="Abrir asistente IA">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
    </button>

    <!-- Ventana del chat (hidden por defecto) -->
    <div id="chat-window" class="chat-window" style="display: none;">
        <div class="chat-header">
            <h3>Asistente de IA</h3>
            <button id="chat-close-btn" class="chat-close">&times;</button>
        </div>

        <div id="chat-messages" class="chat-messages">
            <!-- Mensajes se renderizarán aquí -->
        </div>

        <div class="chat-input-area">
            <textarea 
                id="chat-input" 
                placeholder="Pregunta sobre eventos, QoS, dispositivos, o solicita un escaneo de red..."
                rows="3"
            ></textarea>
            <button id="chat-send-btn" class="chat-send">Enviar</button>
            <button id="chat-clear-btn" class="chat-clear">Limpiar historial</button>
        </div>

        <div id="chat-status" class="chat-status"></div>
    </div>

    <!-- Scripts para markdown -->
    <script src="/js/marked.min.js"></script>
    <script src="/js/purify.min.js"></script>

    <!-- Estilos del Widget -->
    <style>
        .chat-widget {
            position: fixed !important;
            bottom: 20px !important;
            right: 20px !important;
            left: auto !important;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            z-index: 999999 !important;
            pointer-events: auto !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        .chat-toggle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.4);
            display: flex !important;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            position: relative;
            z-index: 999999;
        }

        .chat-toggle:hover {
            background-color: #0056b3;
            box-shadow: 0 6px 16px rgba(0, 123, 255, 0.6);
            transform: scale(1.1);
        }

        .chat-window {
            position: fixed !important;
            bottom: 90px !important;
            right: 20px !important;
            width: 400px;
            max-height: 600px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideIn 0.3s ease;
            z-index: 999998 !important;
            pointer-events: auto !important;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chat-header {
            background-color: #007bff;
            color: white;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #0056b3;
        }

        .chat-header h3 {
            margin: 0;
            font-size: 16px;
        }

        .chat-close {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background-color: #f8f9fa;
            max-height: 400px;
        }

        .chat-message {
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            word-wrap: break-word;
        }

        .chat-message.user {
            background-color: #007bff;
            color: white;
            margin-left: auto;
            max-width: 85%;
        }

        .chat-message.assistant {
            background-color: #e9ecef;
            color: #333;
            margin-right: auto;
            max-width: 85%;
            overflow-x: auto;
        }

        /* Estilos para Markdown */
        .chat-message.assistant h1,
        .chat-message.assistant h2,
        .chat-message.assistant h3,
        .chat-message.assistant h4,
        .chat-message.assistant h5,
        .chat-message.assistant h6 {
            margin-top: 8px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .chat-message.assistant h1 { font-size: 18px; }
        .chat-message.assistant h2 { font-size: 16px; }
        .chat-message.assistant h3 { font-size: 15px; }
        .chat-message.assistant h4 { font-size: 14px; }

        .chat-message.assistant code {
            background-color: #f5f5f5;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }

        .chat-message.assistant pre {
            background-color: #2d2d2d;
            color: #f8f8f2;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 8px 0;
            font-size: 12px;
        }

        .chat-message.assistant pre code {
            background-color: transparent;
            padding: 0;
            color: #f8f8f2;
        }

        .chat-message.assistant ul,
        .chat-message.assistant ol {
            margin: 6px 0;
            padding-left: 20px;
        }

        .chat-message.assistant li {
            margin-bottom: 4px;
        }

        .chat-message.assistant blockquote {
            border-left: 4px solid #007bff;
            padding-left: 12px;
            margin: 6px 0;
            opacity: 0.8;
        }

        .chat-message.assistant table {
            border-collapse: collapse;
            width: 100%;
            margin: 8px 0;
            font-size: 13px;
        }

        .chat-message.assistant table th,
        .chat-message.assistant table td {
            border: 1px solid #ccc;
            padding: 6px 10px;
            text-align: left;
        }

        .chat-message.assistant table th {
            background-color: #d9e6f1;
            font-weight: 600;
        }

        .chat-message.assistant a {
            color: #007bff;
            text-decoration: none;
        }

        .chat-message.assistant a:hover {
            text-decoration: underline;
        }

        .chat-message.system {
            background-color: #fff3cd;
            color: #856404;
            text-align: center;
            margin: 8px auto;
            max-width: 90%;
            font-size: 12px;
        }

        .chat-input-area {
            padding: 12px;
            border-top: 1px solid #dee2e6;
            background-color: white;
        }

        #chat-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            font-family: inherit;
            resize: none;
            margin-bottom: 8px;
        }

        #chat-input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 4px rgba(0, 123, 255, 0.25);
        }

        .chat-send, .chat-clear {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 8px;
            transition: all 0.2s;
        }

        .chat-send {
            background-color: #007bff;
            color: white;
        }

        .chat-send:hover {
            background-color: #0056b3;
        }

        .chat-send:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .chat-clear {
            background-color: #6c757d;
            color: white;
            font-size: 12px;
            padding: 6px 10px;
        }

        .chat-clear:hover {
            background-color: #5a6268;
        }

        .chat-status {
            padding: 8px;
            font-size: 12px;
            color: #6c757d;
            text-align: center;
            min-height: 18px;
        }

        @media (max-width: 600px) {
            .chat-window {
                width: calc(100vw - 40px);
                max-height: calc(100vh - 120px);
            }
        }
    </style>
</div>
