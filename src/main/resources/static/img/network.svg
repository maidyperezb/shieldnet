<svg viewBox="0 0 450 480" xmlns="http://www.w3.org/2000/svg">

  <!-- ── FILA 1: Monitor de Ping + Escaneo de Puertos ── -->

  <!-- Monitor de Ping -->
  <rect x="10" y="10" width="210" height="120" rx="8" fill="#f8f9fa" />
  <text x="25" y="30" font-family="Arial" font-size="14" fill="#2c3e50" font-weight="bold">Monitor de Ping</text>

  <rect x="20" y="38" width="190" height="20" rx="3" fill="#ecf0f1" />
  <text x="25" y="53" font-family="monospace" font-size="12" fill="#27ae60">192.168.1.1 - 2ms</text>

  <rect x="20" y="62" width="190" height="20" rx="3" fill="#ecf0f1" />
  <text x="25" y="77" font-family="monospace" font-size="12" fill="#27ae60">192.168.1.2 - 5ms</text>

  <rect x="20" y="86" width="190" height="20" rx="3" fill="#ecf0f1" />
  <text x="25" y="101" font-family="monospace" font-size="12" fill="#e74c3c">192.168.1.3 - timeout</text>

  <rect x="20" y="110" width="190" height="16" rx="3" fill="#ecf0f1" />
  <text x="25" y="122" font-family="monospace" font-size="12" fill="#27ae60">8.8.8.8 - 18ms</text>

  <!-- Escaneo de Puertos -->
  <rect x="230" y="10" width="210" height="120" rx="8" fill="#f8f9fa" />
  <text x="245" y="30" font-family="Arial" font-size="14" fill="#2c3e50" font-weight="bold">Escaneo de Puertos</text>

  <rect x="240" y="38" width="190" height="76" rx="3" fill="#ecf0f1" />
  <text x="245" y="53" font-family="monospace" font-size="11" fill="#2c3e50">192.168.1.5</text>
  <text x="245" y="68" font-family="monospace" font-size="11" fill="#27ae60">Port 22 (SSH): ABIERTO</text>
  <text x="245" y="83" font-family="monospace" font-size="11" fill="#27ae60">Port 80 (HTTP): ABIERTO</text>
  <text x="245" y="98" font-family="monospace" font-size="11" fill="#27ae60">Port 443 (HTTPS): ABIERTO</text>
  <text x="245" y="113" font-family="monospace" font-size="11" fill="#e74c3c">Port 23 (TELNET): RIESGO</text>

  <!-- ── FILA 2: Tráfico de Red + QoS ── -->

  <!-- Tráfico de Red -->
  <rect x="10" y="140" width="275" height="125" rx="8" fill="#f8f9fa" />
  <text x="25" y="160" font-family="Arial" font-size="14" fill="#2c3e50" font-weight="bold">Trafico de Red (MB)</text>

  <rect x="25" y="168" width="245" height="80" rx="3" fill="#ecf0f1" />
  <line x1="45" y1="228" x2="250" y2="228" stroke="#b2bec3" stroke-width="1" />
  <line x1="45" y1="178" x2="45" y2="228" stroke="#b2bec3" stroke-width="1" />
  <polyline points="45,218 70,208 95,213 120,193 145,203 170,188 195,173 220,183 245,178"
            fill="none" stroke="#3498db" stroke-width="2" />
  <circle cx="45"  cy="218" r="3" fill="#3498db" />
  <circle cx="70"  cy="208" r="3" fill="#3498db" />
  <circle cx="95"  cy="213" r="3" fill="#3498db" />
  <circle cx="120" cy="193" r="3" fill="#3498db" />
  <circle cx="145" cy="203" r="3" fill="#3498db" />
  <circle cx="170" cy="188" r="3" fill="#3498db" />
  <circle cx="195" cy="173" r="3" fill="#3498db" />
  <circle cx="220" cy="183" r="3" fill="#3498db" />
  <circle cx="245" cy="178" r="3" fill="#3498db" />
  <text x="30" y="228" font-family="Arial" font-size="8" fill="#7f8c8d">0</text>
  <text x="30" y="203" font-family="Arial" font-size="8" fill="#7f8c8d">5</text>
  <text x="25" y="178" font-family="Arial" font-size="8" fill="#7f8c8d">10</text>
  <text x="175" y="168" font-family="Arial" font-size="12" fill="#2c3e50">Actual: 8.7 MB</text>

  <!-- QoS -->
  <rect x="295" y="140" width="145" height="125" rx="8" fill="#f8f9fa" />
  <text x="310" y="160" font-family="Arial" font-size="14" fill="#2c3e50" font-weight="bold">Calidad (QoS)</text>

  <rect x="310" y="167" width="55" height="22" rx="4" fill="#27ae60" />
  <text x="337" y="182" font-family="Arial" font-size="11" fill="white" font-weight="bold" text-anchor="middle">MOS 4.2</text>

  <rect x="372" y="167" width="58" height="22" rx="4" fill="#ecf0f1" />
  <text x="401" y="182" font-family="Arial" font-size="10" fill="#27ae60" font-weight="bold" text-anchor="middle">BUENO</text>

  <rect x="310" y="196" width="120" height="16" rx="3" fill="#ecf0f1" />
  <text x="315" y="208" font-family="monospace" font-size="10" fill="#2c3e50">Latencia:  18 ms</text>

  <rect x="310" y="216" width="120" height="16" rx="3" fill="#ecf0f1" />
  <text x="315" y="228" font-family="monospace" font-size="10" fill="#2c3e50">Jitter:     3 ms</text>

  <rect x="310" y="236" width="120" height="16" rx="3" fill="#ecf0f1" />
  <text x="315" y="248" font-family="monospace" font-size="10" fill="#27ae60">Pérdida:  0.0 %</text>

  <circle cx="425" cy="160" r="4" fill="#27ae60">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite" />
  </circle>

  <!-- ── FILA 3: Dispositivos Detectados + Telefonía VoIP ── -->

  <!-- Dispositivos Detectados -->
  <rect x="10" y="275" width="210" height="190" rx="8" fill="#f8f9fa" />
  <text x="25" y="295" font-family="Arial" font-size="14" fill="#2c3e50" font-weight="bold">Dispositivos Detectados</text>

  <!-- Autorizado 1 -->
  <rect x="20" y="302" width="190" height="28" rx="4" fill="#eafaf1" />
  <circle cx="34" cy="316" r="6" fill="#27ae60" />
  <text x="46" y="313" font-family="monospace" font-size="10" fill="#2c3e50">192.168.1.10</text>
  <text x="46" y="325" font-family="Arial" font-size="9" fill="#27ae60">AUTORIZADO</text>
  <text x="170" y="319" font-family="Arial" font-size="9" fill="#7f8c8d" text-anchor="middle">✓</text>

  <!-- Autorizado 2 -->
  <rect x="20" y="334" width="190" height="28" rx="4" fill="#eafaf1" />
  <circle cx="34" cy="348" r="6" fill="#27ae60" />
  <text x="46" y="345" font-family="monospace" font-size="10" fill="#2c3e50">192.168.1.11</text>
  <text x="46" y="357" font-family="Arial" font-size="9" fill="#27ae60">AUTORIZADO</text>
  <text x="170" y="351" font-family="Arial" font-size="9" fill="#7f8c8d" text-anchor="middle">✓</text>

  <!-- Desconocido -->
  <rect x="20" y="366" width="190" height="28" rx="4" fill="#fef9e7" />
  <circle cx="34" cy="380" r="6" fill="#f39c12" />
  <text x="46" y="377" font-family="monospace" font-size="10" fill="#2c3e50">192.168.1.15</text>
  <text x="46" y="389" font-family="Arial" font-size="9" fill="#f39c12">DESCONOCIDO</text>
  <text x="170" y="383" font-family="Arial" font-size="9" fill="#f39c12" text-anchor="middle">?</text>

  <!-- Autorizado 3 -->
  <rect x="20" y="398" width="190" height="28" rx="4" fill="#eafaf1" />
  <circle cx="34" cy="412" r="6" fill="#27ae60" />
  <text x="46" y="409" font-family="monospace" font-size="10" fill="#2c3e50">192.168.1.12</text>
  <text x="46" y="421" font-family="Arial" font-size="9" fill="#27ae60">AUTORIZADO</text>
  <text x="170" y="415" font-family="Arial" font-size="9" fill="#7f8c8d" text-anchor="middle">✓</text>

  <!-- Contadores -->
  <rect x="20" y="430" width="90" height="28" rx="4" fill="#eafaf1" />
  <text x="65" y="449" font-family="Arial" font-size="11" fill="#27ae60" font-weight="bold" text-anchor="middle">3 Autorizados</text>

  <rect x="118" y="430" width="90" height="28" rx="4" fill="#fef9e7" />
  <text x="163" y="449" font-family="Arial" font-size="11" fill="#f39c12" font-weight="bold" text-anchor="middle">1 Desconocido</text>

  <!-- Telefonía VoIP -->
  <rect x="230" y="275" width="210" height="190" rx="8" fill="#f8f9fa" />
  <text x="245" y="295" font-family="Arial" font-size="14" fill="#2c3e50" font-weight="bold">Telefonía VoIP</text>

  <!-- Asterisk status -->
  <rect x="240" y="302" width="190" height="22" rx="4" fill="#eafaf1" />
  <circle cx="252" cy="313" r="5" fill="#27ae60">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="263" y="317" font-family="Arial" font-size="11" fill="#2c3e50">Asterisk: </text>
  <text x="315" y="317" font-family="Arial" font-size="11" fill="#27ae60" font-weight="bold">EN LÍNEA</text>

  <!-- Extensions -->
  <text x="245" y="342" font-family="Arial" font-size="11" fill="#2c3e50" font-weight="bold">Extensiones:</text>

  <rect x="240" y="348" width="190" height="20" rx="3" fill="#ecf0f1" />
  <circle cx="252" cy="358" r="4" fill="#27ae60" />
  <text x="262" y="362" font-family="monospace" font-size="10" fill="#2c3e50">Ext. 1001 — En línea</text>

  <rect x="240" y="372" width="190" height="20" rx="3" fill="#ecf0f1" />
  <circle cx="252" cy="382" r="4" fill="#27ae60" />
  <text x="262" y="386" font-family="monospace" font-size="10" fill="#2c3e50">Ext. 1002 — En línea</text>

  <rect x="240" y="396" width="190" height="20" rx="3" fill="#ecf0f1" />
  <circle cx="252" cy="406" r="4" fill="#e74c3c" />
  <text x="262" y="410" font-family="monospace" font-size="10" fill="#7f8c8d">Ext. 1003 — Fuera línea</text>

  <!-- Active calls + stats -->
  <rect x="240" y="422" width="90" height="36" rx="4" fill="#ecf0f1" />
  <text x="285" y="436" font-family="Arial" font-size="9" fill="#7f8c8d" text-anchor="middle">Llamadas activas</text>
  <text x="285" y="452" font-family="Arial" font-size="18" fill="#3498db" font-weight="bold" text-anchor="middle">0</text>

  <rect x="338" y="422" width="90" height="36" rx="4" fill="#ecf0f1" />
  <text x="383" y="436" font-family="Arial" font-size="9" fill="#7f8c8d" text-anchor="middle">Extensiones</text>
  <text x="383" y="452" font-family="Arial" font-size="18" fill="#27ae60" font-weight="bold" text-anchor="middle">2/3</text>

</svg>
