# Configuraciones específicas del módulo Chat AI Integration

# ====================================================================
# SPRING AI - OPENAI CONFIGURATION (Groq-compatible)
# ====================================================================
# Nota: Groq expone una API compatible con OpenAI, por eso se usa el
# proveedor OpenAI de Spring AI apuntando al host de Groq.
# Las herramientas (Function Calling) funcionan igual.

# Clave de API (usar GROQ_API_KEY u OPENAI_API_KEY según necesidad)
spring.ai.openai.api-key=${GROQ_API_KEY:}

# URL base de la API (Groq compatible con OpenAI API)
# Spring AI concatena automáticamente '/v1/chat/completions'
# (propiedad spring.ai.openai.chat.completions-path), por eso la base URL
# debe terminar en '/openai' y NO debe incluir '/v1'.
# Si GROQ_API_BASE_URL incluye '/v1' la ruta queda duplicada
# ('/openai/v1/v1/chat/completions') y Groq responde 404.
spring.ai.openai.base-url=${GROQ_API_BASE_URL:https://api.groq.com/openai}

# Identificador del modelo de lenguaje (LLM)
# NOTA (2026): 'llama-3.1-8b-instant' fue decommissioned por Groq el
# 16/08/2026 (ver https://console.groq.com/docs/deprecations). Desde esa
# fecha las peticiones con ese model id devuelven 404 porque el recurso
# ya no existe. Groq recomienda 'openai/gpt-oss-20b' como reemplazo
# directo; 'openai/gpt-oss-120b' es la alternativa de mayor capacidad.
spring.ai.openai.chat.options.model=${GROQ_CHAT_MODEL:openai/gpt-oss-20b}

# Grado de aleatoriedad de la respuesta (0.0 a 1.0)
# Groq recomienda un rango de 0.5-0.7 para los modelos gpt-oss.
spring.ai.openai.chat.options.temperature=${GROQ_CHAT_TEMPERATURE:0.7}

# Núcleo de muestreo (Top-p): controla la diversidad del modelo
# Valor recomendado por Groq para los modelos gpt-oss.
spring.ai.openai.chat.options.top-p=${GROQ_CHAT_TOP_P:0.95}

# Límite máximo de tokens que el modelo puede generar en una sola respuesta
# En los modelos gpt-oss los tokens de razonamiento se consumen de este
# mismo límite, por eso se sube a 8192 para asegurar que quede contenido
# final además del razonamiento.
spring.ai.openai.chat.options.max-tokens=${GROQ_CHAT_MAX_TOKENS:8192}

# ====================================================================
# CHAT SERVICE CONFIGURATION
# ====================================================================
# Comportamiento general del servicio de chat.

# Ruta del recurso que contiene el System Prompt para el comportamiento de la IA.
chat.system.prompt.template=classpath:prompts/system-prompt.txt

# Número máximo de mensajes previos del chat para mantener la memoria de la conversación.
chat.max-history=${CHAT_MAX_HISTORY:20}

# Ventana temporal (en días) para filtrar el contexto histórico relevante del chat.
chat.context-days=${CHAT_CONTEXT_DAYS:7}

# Switch global para habilitar/deshabilitar Function Calling (herramientas externas).
chat.enable-function-calling=${CHAT_ENABLE_FUNCTION_CALLING:false}

# Límite de peticiones a la API de Groq para evitar bloqueos por Rate Limiting.
chat.groq.requests-per-minute=${CHAT_GROQ_REQUESTS_PER_MINUTE:60}

# ====================================================================
# TOOL CONFIGURATIONS
# ====================================================================
# Parámetros operativos para las funciones (Function Calling) que la IA puede ejecutar.

# Historial de eventos: Rango de búsqueda temporal por defecto y límite de registros a retornar.
tool.event-history.days-default=${TOOL_EVENT_HISTORY_DAYS_DEFAULT:7}
tool.event-history.max-results=${TOOL_EVENT_HISTORY_MAX_RESULTS:100}

# Métricas de QoS: Rango de consulta y ventana de agrupación temporal para el análisis de tráfico.
tool.qos-metrics.days-default=${TOOL_QOS_METRICS_DAYS_DEFAULT:7}
tool.qos-metrics.aggregation-window=${TOOL_QOS_METRICS_AGGREGATION_WINDOW:1h}

# Escaneo de Red: Límites de tiempo de ejecución, cantidad de hosts y métodos de descubrimiento permitidos.
tool.network-scan.timeout-seconds=${TOOL_NETWORK_SCAN_TIMEOUT_SECONDS:60}
tool.network-scan.max-hosts=${TOOL_NETWORK_SCAN_MAX_HOSTS:256}
tool.network-scan.allowed-types=${TOOL_NETWORK_SCAN_ALLOWED_TYPES:arp,port}

# Gestión de dispositivos: Forzado de validación de permisos antes de realizar cambios de estado.
tool.devices.check-authorization-before-action=${TOOL_DEVICES_CHECK_AUTHORIZATION_BEFORE_ACTION:true}

# Generación de Reportes: Período de datos a incluir y flag para renderizado de componentes visuales.
tool.report.days-default=${TOOL_REPORT_DAYS_DEFAULT:7}
tool.report.include-charts=${TOOL_REPORT_INCLUDE_CHARTS:true}

# ====================================================================
# CHAT PERSISTENCE
# ====================================================================
# Gestión del ciclo de vida de los mensajes y almacenamiento en base de datos.

# Política de purga: Días de persistencia, activación de limpieza automática y expresión Cron (2:00 AM diario).
chat.db.retention-days=${CHAT_DB_RETENTION_DAYS:90}
chat.db.auto-cleanup=${CHAT_DB_AUTO_CLEANUP:true}
chat.db.cleanup-schedule=${CHAT_DB_CLEANUP_SCHEDULE:0 0 2 * * ?}

# Gestión de estado: Tiempo de inactividad antes de cerrar sesión y límite de hilos activos por instancia.
chat.session.timeout-minutes=${CHAT_SESSION_TIMEOUT_MINUTES:30}
chat.session.max-concurrent=${CHAT_SESSION_MAX_CONCURRENT:10}

# ====================================================================
# SECURITY & RATE LIMITING
# ====================================================================
# Protecciones contra abuso de API y control de acceso a funciones críticas.

# Control de tráfico: Cuotas de peticiones por usuario para prevenir sobrecarga del modelo (LLM).
chat.rate-limit.enabled=${CHAT_RATE_LIMIT_ENABLED:true}
chat.rate-limit.requests-per-minute=${CHAT_RATE_LIMIT_REQUESTS_PER_MINUTE:30}
chat.rate-limit.requests-per-hour=${CHAT_RATE_LIMIT_REQUESTS_PER_HOUR:300}

# Seguridad de herramientas: Lista de funciones que requieren token válido y lista blanca de herramientas ejecutables.
chat.auth.required-for-tools=${CHAT_AUTH_REQUIRED_FOR_TOOLS:queryEventHistory,queryQoSMetrics,listAuthorizedDevices,executeNetworkScan,generateMonitoringReport}
chat.function-calling.require-confirmation=${CHAT_FUNCTION_CALLING_REQUIRE_CONFIRMATION:false}
chat.function-calling.allowed-tools=${CHAT_FUNCTION_CALLING_ALLOWED_TOOLS:queryEventHistory,queryQoSMetrics,listAuthorizedDevices,executeNetworkScan,generateMonitoringReport}

# ====================================================================
# UI/UX CONFIGURATION
# ====================================================================
# Configuración visual y de experiencia de usuario para el frontend del chat.

# Aspecto del Widget: Comportamiento de apertura, mensaje de bienvenida, ubicación y dimensiones en pantalla.
# [TODO]: Ajustar segun preferencias fututas de diseño
chat.widget.auto-open=${CHAT_WIDGET_AUTO_OPEN:false}
chat.widget.initial-message=${CHAT_WIDGET_INITIAL_MESSAGE:¡Hola! Soy tu asistente de ciberseguridad. Puedo ayudarte a analizar eventos, métricas de red y dispositivos. ¿En qué puedo ayudarte?}
chat.widget.position=${CHAT_WIDGET_POSITION:bottom-right}
chat.widget.width=${CHAT_WIDGET_WIDTH:400px}
chat.widget.height=${CHAT_WIDGET_HEIGHT:600px}

# Transmisión de respuesta (Server-Sent Events): Controla la fluidez con la que aparece el texto generado.
chat.streaming.enabled=${CHAT_STREAMING_ENABLED:true}
chat.streaming.chunk-size=${CHAT_STREAMING_CHUNK_SIZE:100}
chat.streaming.update-interval-ms=${CHAT_STREAMING_UPDATE_INTERVAL_MS:50}