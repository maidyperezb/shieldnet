# Configuración de la base de datos MySQL
spring.application.name=shieldnet
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:shieldnet}?serverTimezone=UTC
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.main.web-application-type=servlet


# Configuración de logging
logging.level.com.example.security=${LOGGING_LEVEL_COM_EXAMPLE_SECURITY:DEBUG}
logging.level.org.springframework.web=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB:INFO}
logging.level.org.hibernate=${LOGGING_LEVEL_ORG_HIBERNATE:INFO}

# Configuración del servidor
server.port=${SERVER_PORT:8080}
server.address=0.0.0.0

asterisk.host=${ASTERISK_HOST:172.29.126.164}
asterisk.port=${ASTERISK_PORT:5038}
asterisk.username=${ASTERISK_USERNAME:admin}
asterisk.password=${ASTERISK_PASSWORD:Admin123}


# Permitir mensajes de error detallados en REST
server.error.include-message=${SERVER_ERROR_INCLUDE_MESSAGE:always}
server.error.include-binding-errors=${SERVER_ERROR_INCLUDE_BINDING_ERRORS:always}

spring.web.resources.static-locations=classpath:/static/

# URL del servicio de Machine Learning
ml.service.url=http://localhost:5050

# Configuración de perfiles de Spring adicional
spring.profiles.include=chat

# Configuración del contexto para el Chat AI
chat.context-days=7
chat.max-context-chars=4000
chat.max-events=50
chat.max-device-details=5
chat.max-event-samples=10
