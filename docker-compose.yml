version: '3.8'

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: shieldnet
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./src/main/resources/db/shieldnet.sql:/docker-entrypoint-initdb.d/shieldnet.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 30

  ml:
    build:
      context: ./shieldnet-ml
      dockerfile: Dockerfile
    ports:
      - "5050:5050"
    environment:
      - PORT=5050
      - MODEL_PATH=/app/qos_model.pkl
    depends_on:
      - db

  optimizacion:
    build:
      context: ./Modelo Matematico
      dockerfile: Dockerfile
    ports:
      - "5060:5060"
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=rootpass
      - MYSQL_DATABASE=shieldnet
    depends_on:
      - db

  spring:
    build:
      context: .
      dockerfile: docker/spring/Dockerfile
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: rootpass
      MYSQL_DATABASE: shieldnet
      ml.service.url: http://ml:5050
      ML_SERVICE_URL: http://ml:5050
      SERVER_PORT: 8080
      GROQ_API_KEY: gsk_dummy_key_for_development
      GROQ_API_BASE_URL: https://api.groq.com/openai
      GROQ_CHAT_MODEL: llama-3.1-8b-instant
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_started
      optimizacion:
        condition: service_started

volumes:
  db_data:
