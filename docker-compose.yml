version: '3.8'

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: shieldnet
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  ml:
    build:
      context: ./shieldnet-ml
      dockerfile: Dockerfile
    ports:
      - "5050:5050"
    environment:
      - PORT=5050
      - MODEL_PATH=/app/qos_model.pkl
    depends_on:
      - db

  optimizacion:
    build:
      context: ./Modelo Matematico
      dockerfile: Dockerfile
    ports:
      - "5060:5060"
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=rootpass
      - MYSQL_DATABASE=shieldnet
    depends_on:
      - db

  spring:
    build:
      context: .
      dockerfile: docker/spring/Dockerfile
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: rootpass
      MYSQL_DATABASE: shieldnet
      ml.service.url: http://ml:5050
      ML_SERVICE_URL: http://ml:5050
      SERVER_PORT: 8080
    depends_on:
      - db
      - ml
      - optimizacion

volumes:
  db_data:
